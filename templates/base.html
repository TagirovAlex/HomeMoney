<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HomeMoney{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-layout">
        <header>
            <div class="header-left">
                <a href="/" class="logo"><img src="/static/logo.jpg" alt="HomeMoney" class="logo-img"></a>
                <nav id="main-nav">
                    <a href="/transactions" class="nav-link">Транзакции</a>
                    <a href="/incomes" class="nav-link">Доходы</a>
                    <a href="/savings" class="nav-link">Накопления</a>
                    <a href="/budgets" class="nav-link">Бюджеты</a>
                    <a href="/categories" class="nav-link">Категории</a>
                    <a href="/reports" class="nav-link">Отчёты</a>
                    <a href="/admin" class="nav-link">Админ</a>
                </nav>
            </div>
            <div class="header-right">
                <button id="nav-toggle" aria-label="Меню">☰</button>
                <span id="user-email" class="user-email hidden"></span>
                <button id="theme-toggle" aria-label="Переключить тему">🌙</button>
                <button id="logout-btn" class="btn-logout hidden">Выйти</button>
            </div>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
