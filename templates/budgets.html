{% extends "base.html" %}
{% block title %}HomeMoney | Бюджеты{% endblock %}
{% block content %}
<div class="page-header">
    <h2>Бюджеты</h2>
    <button class="btn" onclick="showAddForm()">+ Создать</button>
</div>

<div id="add-form" class="form-card" style="display:none">
    <h3>Новый бюджет</h3>
    <form onsubmit="addBudget(event)">
        <label>Категория <select id="bg-category" required></select></label>
        <label>Лимит <input type="number" step="0.01" id="bg-amount" required></label>
        <button type="submit" class="btn">Сохранить</button>
        <button type="button" class="btn btn-secondary" onclick="hideAddForm()">Отмена</button>
    </form>
</div>

<div id="budgets-list" class="budgets-grid"></div>

<script>
    async function loadCategories() {
        var r = await fetch('/api/v1/categories', { headers: authHeaders() });
        var d = await r.json();
        if (d.status !== 'success') return;
        var sel = document.getElementById('bg-category');
        sel.innerHTML = '<option value="">-- Выберите --</option>' +
            d.data.map(function(c) { return '<option value="' + c.id + '">' + c.name + '</option>'; }).join('');
    }

    async function loadBudgets() {
        var r = await fetch('/api/v1/budgets', { headers: authHeaders() });
        var d = await r.json();
        var container = document.getElementById('budgets-list');
        if (d.status !== 'success' || !d.data.length) { container.innerHTML = '<p>Нет бюджетов. Создайте первый.</p>'; return; }
        container.innerHTML = d.data.map(function(b) {
            return '<div class="card"><span class="card-label">' + (b.category_icon || '📁') + ' ' + b.category_name + '</span><span class="card-value">' + b.target_amount.toFixed(2) + ' RUB</span></div>';
        }).join('');
    }
    function showAddForm() { document.getElementById('add-form').style.display = 'block'; }
    function hideAddForm() { document.getElementById('add-form').style.display = 'none'; }
    async function addBudget(e) {
        e.preventDefault();
        var r = await fetch('/api/v1/budgets', {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify({
                category_id: parseInt(document.getElementById('bg-category').value),
                target_amount: parseFloat(document.getElementById('bg-amount').value)
            })
        });
        var d = await r.json();
        alert(d.message || d.error);
        if (r.ok) { hideAddForm(); loadBudgets(); }
    }
    window.onload = function() { loadCategories(); loadBudgets(); };
</script>
{% endblock %}
