{% extends "base.html" %}
{% block title %}HomeMoney | Бюджеты{% endblock %}
{% block content %}
<div class="page-header">
    <h2>Бюджеты</h2>
    <button class="btn" id="bg-add-btn">+ Создать</button>
</div>

<div class="month-nav">
    <button class="btn btn-secondary" id="bg-prev-btn">◀</button>
    <span id="month-label" class="month-label"></span>
    <button class="btn btn-secondary" id="bg-next-btn">▶</button>
    <button class="btn btn-secondary" id="copy-btn" title="Копировать переопределения с прошлого месяца">📋 Копировать</button>
</div>

<div id="add-form" class="form-card hidden">
    <h3 id="add-form-title">Новый бюджет</h3>
    <form id="bg-form">
        <input type="hidden" id="bg-edit-id" value="">
        <label>Категория <select id="bg-category" required></select></label>
        <label>Лимит <input type="number" step="0.01" id="bg-amount" required></label>

        <div class="radio-group">
            <label class="radio-label"><input type="radio" name="bg-type" value="template" checked>
                Каждый месяц (шаблон)</label>
            <label class="radio-label"><input type="radio" name="bg-type" value="month">
                Один месяц</label>
            <label class="radio-label"><input type="radio" name="bg-type" value="period">
                Период</label>
        </div>

        <div id="bg-month-fields" class="period-fields hidden">
            <label>Месяц
                <select id="bg-month"></select>
            </label>
            <label>Год
                <select id="bg-year"></select>
            </label>
        </div>

        <div id="bg-period-fields" class="period-fields hidden">
            <label>С
                <select id="bg-period-from-month"></select>
                <select id="bg-period-from-year"></select>
            </label>
            <label>По
                <select id="bg-period-to-month"></select>
                <select id="bg-period-to-year"></select>
            </label>
        </div>

        <button type="submit" class="btn" id="bg-submit">Сохранить</button>
        <button type="button" class="btn btn-secondary" id="bg-cancel-btn">Отмена</button>
    </form>
</div>

<div id="budgets-list"></div>

{% block scripts %}
<script src="{{ url_for('static', filename='js/pages/budgets.js') }}"></script>
{% endblock %}
{% endblock %}
