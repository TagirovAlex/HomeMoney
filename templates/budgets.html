{% extends "base.html" %}
{% block title %}HomeMoney | Бюджеты{% endblock %}
{% block content %}
<div class="page-header">
    <h2>Бюджеты</h2>
    <button class="btn" onclick="showAddForm()">+ Создать</button>
</div>

<div id="add-form" class="form-card" style="display:none">
    <h3 id="add-form-title">Новый бюджет</h3>
    <form onsubmit="saveBudget(event)">
        <input type="hidden" id="bg-edit-id" value="">
        <label>Категория <select id="bg-category" required></select></label>
        <label>Лимит <input type="number" step="0.01" id="bg-amount" required></label>
        <button type="submit" class="btn" id="bg-submit">Сохранить</button>
        <button type="button" class="btn btn-secondary" onclick="hideAddForm()">Отмена</button>
    </form>
</div>

<div id="budgets-list" class="budgets-grid"></div>

{% block scripts %}
<script src="{{ url_for('static', filename='js/pages/budgets.js') }}"></script>
{% endblock %}
{% endblock %}
