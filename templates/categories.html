{% extends "base.html" %}
{% block title %}HomeMoney | Категории{% endblock %}
{% block content %}
<div class="page-header">
    <h2>Категории</h2>
</div>

<div class="card card-left" style="max-width:800px;margin-bottom:20px">
    <h3>Новая категория</h3>
    <form onsubmit="addCategory(event)">
        <div class="form-row">
            <input type="text" id="cat-name" placeholder="Название" required class="flex-2">
            <input type="text" id="cat-icon" placeholder="Иконка (эмодзи)" class="max-w-70">
        </div>
        <div class="form-row">
            <input type="text" id="cat-desc" placeholder="Описание" class="flex-2">
            <select id="cat-type" class="flex-1">
                <option value="expense">💳 Расход</option>
                <option value="income">💰 Доход</option>
            </select>
        </div>
        <input type="hidden" id="cat-edit-id" value="">
        <button type="submit" class="btn" id="cat-submit" style="margin-top:8px">+</button>
    </form>
</div>

<div class="card card-left" style="max-width:800px">
    <h3>Все категории</h3>
    <table class="data-table">
        <thead><tr><th>ID</th><th>Иконка</th><th>Название</th><th>Тип</th><th></th></tr></thead>
        <tbody id="categories-body"><tr><td colspan="5">Загрузка...</td></tr></tbody>
    </table>
</div>

{% block scripts %}
<script src="{{ url_for('static', filename='js/pages/categories.js') }}"></script>
{% endblock %}
{% endblock %}
