{% extends "base.html" %}
{% block title %}HomeMoney | Категории{% endblock %}
{% block content %}
<div class="page-header">
    <h2>Категории</h2>
</div>

<div class="card" style="max-width:800px;margin-bottom:20px">
    <h3>Новая категория</h3>
    <form onsubmit="addCategory(event)">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
            <input type="text" id="cat-name" placeholder="Название" required style="flex:2;min-width:140px; padding:8px;">
            <input type="text" id="cat-icon" placeholder="Иконка (эмодзи)" style="max-width:80px">
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
            <input type="text" id="cat-desc" placeholder="Описание" style="flex:2;min-width:140px; padding:8px;">
            <select id="cat-type" style="flex:1;min-width:100px;padding:8px;border:1px solid var(--color-border);border-radius:6px;background:var(--color-bg);color:var(--color-text)">
                <option value="expense">💳 Расход</option>
                <option value="income">💰 Доход</option>
            </select>
        </div>
        <input type="hidden" id="cat-edit-id" value="">
        <button type="submit" class="btn" id="cat-submit" style="margin-top:8px">+</button>
    </form>
</div>

<div class="card" style="max-width:800px">
    <h3>Все категории</h3>
    <table class="data-table">
        <thead><tr><th>ID</th><th>Иконка</th><th>Название</th><th>Тип</th><th></th></tr></thead>
        <tbody id="categories-body"><tr><td colspan="5">Загрузка...</td></tr></tbody>
    </table>
</div>

<script>
    var h = function() { return { 'Authorization': 'Bearer ' + localStorage.getItem('token'), 'Content-Type': 'application/json' }; };

    async function loadCategories() {
        var r = await fetch('/api/v1/categories', { headers: h() });
        var d = await r.json();
        var tbody = document.getElementById('categories-body');
        if (d.status !== 'success') { tbody.innerHTML = '<tr><td colspan="5">' + d.message + '</td></tr>'; return; }
        tbody.innerHTML = d.data.map(function(c) {
            var icon = c.icon || '📁';
            var typeLabel = c.type === 'income' ? '💰 Доход' : '💳 Расход';
            var safe = JSON.stringify([c.id, c.name, c.icon || '', c.description || '', c.type]);
            return '<tr><td>' + c.id + '</td><td style="font-size:1.4rem">' + icon + '</td><td>' + c.name.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</td><td>' + typeLabel + '</td>' +
                '<td><button class="btn btn-secondary" style="margin-right:4px" data-cat=\'' + safe + '\' onclick="editCategory(this)">✏️</button>' +
                '<button class="btn btn-secondary" onclick="deleteCategory(' + c.id + ')">✕</button></td></tr>';
        }).join('');
    }

    async function addCategory(e) {
        e.preventDefault();
        var editId = document.getElementById('cat-edit-id').value;
        var body = {
            name: document.getElementById('cat-name').value,
            description: document.getElementById('cat-desc').value,
            icon: document.getElementById('cat-icon').value,
            type: document.getElementById('cat-type').value,
        };
        var url = editId ? '/api/v1/categories/' + editId : '/api/v1/categories';
        var method = editId ? 'PUT' : 'POST';
        var r = await fetch(url, { method: method, headers: h(), body: JSON.stringify(body) });
        var d = await r.json();
        alert(d.message || JSON.stringify(d));
        if (r.ok) {
            document.getElementById('cat-name').value = '';
            document.getElementById('cat-desc').value = '';
            document.getElementById('cat-icon').value = '';
            document.getElementById('cat-type').value = 'expense';
            document.getElementById('cat-edit-id').value = '';
            document.getElementById('cat-submit').textContent = '+';
            loadCategories();
        }
    }

    function editCategory(btn) {
        var data = JSON.parse(btn.getAttribute('data-cat'));
        document.getElementById('cat-edit-id').value = data[0];
        document.getElementById('cat-name').value = data[1];
        document.getElementById('cat-icon').value = data[2];
        document.getElementById('cat-desc').value = data[3];
        document.getElementById('cat-type').value = data[4] || 'expense';
        document.getElementById('cat-submit').textContent = '✏️';
    }

    async function deleteCategory(id) {
        if (!confirm('Удалить категорию?')) return;
        var r = await fetch('/api/v1/categories/' + id, { method: 'DELETE', headers: h() });
        var d = await r.json();
        alert(d.message); loadCategories();
    }

    window.onload = function() { loadCategories(); };
</script>
{% endblock %}
