<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} | HomeMoney</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="error-container">
        <header>
            <a href="/" class="logo"><img src="/static/logo.jpg" alt="HomeMoney" class="logo-img"></a>
            <button id="theme-toggle" aria-label="Переключить тему">🌙</button>
        </header>
        <main class="error-main">
            <div class="error-card">
                <span class="error-code">{{ code }}</span>
                <p class="error-message">{{ message }}</p>
                <a href="/" class="btn">На главную</a>
            </div>
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/error.js') }}"></script>
</body>
</html>
