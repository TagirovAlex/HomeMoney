{% extends "base.html" %}
{% block title %}HomeMoney | Доходы{% endblock %}
{% block content %}
<div class="page-header">
    <h2>Источники дохода</h2>
    <div>
        <button class="btn" onclick="processDue()">🔄 Обработать регулярные</button>
        <button class="btn" onclick="showAddForm()">+ Добавить</button>
    </div>
</div>

<div id="add-form" class="form-card" style="display:none">
    <h3 id="form-title">Новый источник дохода</h3>
    <form onsubmit="saveIncome(event)">
        <input type="hidden" id="inc-id" value="">
        <label>Название <input type="text" id="inc-name" required></label>
        <label>Сумма <input type="number" step="0.01" id="inc-amount" value="0" required></label>
        <label>Категория <select id="inc-category" required></select></label>
        <label>Описание <input type="text" id="inc-desc"></label>
        <label>
            <input type="checkbox" id="inc-regular" checked onchange="toggleRegular()"> Регулярный
        </label>
        <div id="regular-fields">
            <label>Период
                <select id="inc-period">
                    <option value="daily">Ежедневно</option>
                    <option value="weekly">Еженедельно</option>
                    <option value="monthly" selected>Ежемесячно</option>
                    <option value="yearly">Ежегодно</option>
                </select>
            </label>
            <label>День (для monthly/yearly) <input type="number" id="inc-day" value="1" min="1" max="31"></label>
        </div>
        <button type="submit" class="btn" id="form-submit">Сохранить</button>
        <button type="button" class="btn btn-secondary" onclick="hideAddForm()">Отмена</button>
    </form>
</div>

<div id="incomes-list" class="summary-cards"></div>

<div id="process-result" class="card hidden" style="margin-top:16px"></div>

{% block scripts %}
<script src="{{ url_for('static', filename='js/pages/incomes.js') }}"></script>
{% endblock %}
{% endblock %}
