{% extends "base.html" %}
{% block title %}HomeMoney | Доходы{% endblock %}
{% block content %}
<div class="page-header">
    <h2>Источники дохода</h2>
    <div>
        <button class="btn" onclick="processDue()">🔄 Обработать регулярные</button>
        <button class="btn" onclick="showAddForm()">+ Добавить</button>
    </div>
</div>

<div id="add-form" class="form-card" style="display:none">
    <h3 id="form-title">Новый источник дохода</h3>
    <form onsubmit="saveIncome(event)">
        <input type="hidden" id="inc-id" value="">
        <label>Название <input type="text" id="inc-name" required></label>
        <label>Сумма <input type="number" step="0.01" id="inc-amount" value="0" required></label>
        <label>Категория <select id="inc-category" required></select></label>
        <label>Описание <input type="text" id="inc-desc"></label>
        <label>
            <input type="checkbox" id="inc-regular" checked onchange="toggleRegular()"> Регулярный
        </label>
        <div id="regular-fields">
            <label>Период
                <select id="inc-period">
                    <option value="daily">Ежедневно</option>
                    <option value="weekly">Еженедельно</option>
                    <option value="monthly" selected>Ежемесячно</option>
                    <option value="yearly">Ежегодно</option>
                </select>
            </label>
            <label>День (для monthly/yearly) <input type="number" id="inc-day" value="1" min="1" max="31"></label>
        </div>
        <button type="submit" class="btn" id="form-submit">Сохранить</button>
        <button type="button" class="btn btn-secondary" onclick="hideAddForm()">Отмена</button>
    </form>
</div>

<div id="incomes-list" class="summary-cards"></div>

<div id="process-result" style="display:none; margin-top: 16px;" class="card"></div>

<script>
    async function loadCategories() {
        var r = await fetch('/api/v1/categories', { headers: authHeaders() });
        var d = await r.json();
        if (d.status !== 'success') return;
        var sel = document.getElementById('inc-category');
        sel.innerHTML = d.data.map(function(c) {
            return '<option value="' + c.id + '">' + c.name + '</option>';
        }).join('');
    }

    async function loadIncomes() {
        var r = await fetch('/api/v1/incomes', { headers: authHeaders() });
        var d = await r.json();
        var container = document.getElementById('incomes-list');
        if (d.status !== 'success' || !d.data.length) {
            container.innerHTML = '<p>Нет источников дохода. Добавьте первый.</p>';
            return;
        }
        container.innerHTML = d.data.map(function(s) {
            var label = (s.is_regular ? '🔄 ' : '📌 ') + s.name;
            var info = (s.amount ? fmt(s.amount) + ' RUB' : '') + (s.is_regular && s.next_date ? ' (след: ' + s.next_date.slice(0,10) + ')' : '');
            return '<div class="card" style="text-align:left">' +
                '<div style="display:flex;justify-content:space-between;align-items:center">' +
                '<div><span class="card-label">' + label + '</span><br><span class="card-value" style="font-size:1.2rem">' + info + '</span></div>' +
                '<div><button class="btn btn-secondary" style="margin-right:4px" onclick="editIncome(' + s.id + ')">✏️</button>' +
                '<button class="btn btn-secondary" onclick="deleteIncome(' + s.id + ')">❌</button></div>' +
                '</div></div>';
        }).join('');
    }

    function toggleRegular() {
        document.getElementById('regular-fields').style.display =
            document.getElementById('inc-regular').checked ? 'block' : 'none';
    }

    function showAddForm() {
        document.getElementById('form-title').textContent = 'Новый источник дохода';
        document.getElementById('form-submit').textContent = 'Сохранить';
        document.getElementById('inc-id').value = '';
        document.getElementById('inc-name').value = '';
        document.getElementById('inc-amount').value = '0';
        document.getElementById('inc-desc').value = '';
        document.getElementById('inc-regular').checked = true;
        document.getElementById('inc-period').value = 'monthly';
        document.getElementById('inc-day').value = '1';
        toggleRegular();
        document.getElementById('add-form').style.display = 'block';
    }

    function hideAddForm() {
        document.getElementById('add-form').style.display = 'none';
    }

    async function saveIncome(e) {
        e.preventDefault();
        var id = document.getElementById('inc-id').value;
        var body = {
            name: document.getElementById('inc-name').value,
            amount: parseFloat(document.getElementById('inc-amount').value) || 0,
            category_id: parseInt(document.getElementById('inc-category').value),
            description: document.getElementById('inc-desc').value,
            is_regular: document.getElementById('inc-regular').checked,
            period: document.getElementById('inc-period').value,
            day_of_period: parseInt(document.getElementById('inc-day').value) || 1,
        };
        var url = id ? '/api/v1/incomes/' + id : '/api/v1/incomes';
        var method = id ? 'PUT' : 'POST';
        var r = await fetch(url, { method: method, headers: authHeaders(), body: JSON.stringify(body) });
        var d = await r.json();
        alert(d.message || d.error);
        if (r.ok) { hideAddForm(); loadIncomes(); }
    }

    async function editIncome(id) {
        var r = await fetch('/api/v1/incomes', { headers: authHeaders() });
        var d = await r.json();
        if (d.status !== 'success') return;
        var src = null;
        d.data.forEach(function(s) { if (s.id === id) src = s; });
        if (!src) return;
        document.getElementById('form-title').textContent = 'Редактировать: ' + src.name;
        document.getElementById('form-submit').textContent = 'Обновить';
        document.getElementById('inc-id').value = src.id;
        document.getElementById('inc-name').value = src.name;
        document.getElementById('inc-amount').value = src.amount;
        document.getElementById('inc-desc').value = src.description || '';
        document.getElementById('inc-regular').checked = src.is_regular;
        document.getElementById('inc-period').value = src.period || 'monthly';
        document.getElementById('inc-day').value = src.day_of_period || 1;
        document.getElementById('inc-category').value = src.category_id;
        toggleRegular();
        document.getElementById('add-form').style.display = 'block';
    }

    async function deleteIncome(id) {
        if (!confirm('Удалить этот источник дохода?')) return;
        var r = await fetch('/api/v1/incomes/' + id, { method: 'DELETE', headers: authHeaders() });
        var d = await r.json();
        alert(d.message); loadIncomes();
    }

    async function processDue() {
        var btn = document.querySelector('.btn:first-child');
        btn.textContent = '⏳ Обработка...';
        btn.disabled = true;
        var r = await fetch('/api/v1/incomes/process', { method: 'POST', headers: authHeaders() });
        var d = await r.json();
        btn.textContent = '🔄 Обработать регулярные';
        btn.disabled = false;
        var el = document.getElementById('process-result');
        if (d.status === 'success' && d.data) {
            var msg = '✅ Обработано: ' + d.data.processed;
            if (d.data.errors && d.data.errors.length) msg += ', ошибок: ' + d.data.errors.length;
            el.textContent = msg;
        } else {
            el.textContent = '❌ ' + (d.message || 'Ошибка');
        }
        el.style.display = 'block';
        setTimeout(function() { el.style.display = 'none'; }, 5000);
        loadIncomes();
    }

    window.onload = function() { loadCategories(); loadIncomes(); };
</script>
{% endblock %}
