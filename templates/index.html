{% extends "base.html" %}
{% block title %}HomeMoney | Дашборд{% endblock %}
{% block content %}
<div class="page-header">
    <h2>Финансовая сводка</h2>
    <span class="period-label">{%current_month% %current_year%}</span>
</div>
<div class="summary-cards" id="summary-data">
    <div class="card">
        <span class="card-label">💰 Доходы</span>
        <span class="card-value income" id="total-income">--</span>
    </div>
    <div class="card">
        <span class="card-label">💳 Расходы</span>
        <span class="card-value expense" id="total-spent">--</span>
    </div>
    <div class="card">
        <span class="card-label">📊 Бюджет</span>
        <span class="card-value" id="total-budgeted">--</span>
    </div>
    <div class="card">
        <span class="card-label">Транзакций</span>
        <span class="card-value" id="transactions-count">--</span>
    </div>
</div>
<div class="section">
    <h3>Последние транзакции</h3>
    <table class="data-table">
        <thead>
            <tr><th>Категория</th><th>Описание</th><th>Сумма</th></tr>
        </thead>
        <tbody id="transactions-list"></tbody>
    </table>
</div>
<script>
    async function loadDashboard() {
        try {
        var r = await fetch('/api/v1/transactions', { headers: authHeaders() });
        var d = await r.json();
            if (d.status === 'success') {
                document.getElementById('total-income').textContent = '+' + d.data.total_income.toFixed(2) + ' RUB';
                document.getElementById('total-spent').textContent = '-' + d.data.total_spent.toFixed(2) + ' RUB';
                document.getElementById('total-budgeted').textContent = d.data.total_budgeted.toFixed(2) + ' RUB';
                document.getElementById('transactions-count').textContent = d.data.transactions_count;
            }
        } catch(e) { console.error(e); }
    }
    window.onload = loadDashboard;
</script>
{% endblock %}
