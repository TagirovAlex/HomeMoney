<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeMoney | Вход</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <h1 class="auth-logo">HomeMoney</h1>
            <div id="auth-card-body">
                <h2 id="auth-title">Вход</h2>
                <div id="auth-error" class="auth-error hidden"></div>
                <form id="auth-form">
                    <label>Email <input type="email" id="auth-email" required></label>
                    <label>Пароль <input type="password" id="auth-password" required></label>
                    <button type="submit" class="btn auth-btn" id="auth-submit">Войти</button>
                </form>
                <p class="auth-switch">
                    <span id="auth-switch-text">Нет аккаунта?</span>
                    <a href="#" id="auth-switch-link">Зарегистрироваться</a>
                </p>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/pages/login.js') }}"></script>
</body>
</html>
