<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeMoney | Вход</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <h1 class="auth-logo">HomeMoney</h1>
            <div id="auth-form">
                <h2 id="auth-title">Вход</h2>
                <div id="auth-error" class="auth-error hidden"></div>
                <form onsubmit="return handleAuth(event)">
                    <label>Email <input type="email" id="auth-email" required></label>
                    <label>Пароль <input type="password" id="auth-password" required></label>
                    <button type="submit" class="btn auth-btn" id="auth-submit">Войти</button>
                </form>
                <p class="auth-switch">
                    <span id="auth-switch-text">Нет аккаунта?</span>
                    <a href="#" onclick="toggleAuthMode(); return false" id="auth-switch-link">Зарегистрироваться</a>
                </p>
            </div>
        </div>
    </div>
    <script>
        var isLogin = true;

        function toggleAuthMode() {
            isLogin = !isLogin;
            document.getElementById('auth-title').textContent = isLogin ? 'Вход' : 'Регистрация';
            document.getElementById('auth-submit').textContent = isLogin ? 'Войти' : 'Зарегистрироваться';
            document.getElementById('auth-switch-text').textContent = isLogin ? 'Нет аккаунта?' : 'Уже есть аккаунт?';
            document.getElementById('auth-switch-link').textContent = isLogin ? 'Зарегистрироваться' : 'Войти';
            document.getElementById('auth-error').classList.add('hidden');
        }

        async function handleAuth(e) {
            e.preventDefault();
            var email = document.getElementById('auth-email').value;
            var password = document.getElementById('auth-password').value;
            var endpoint = isLogin ? '/api/v1/login' : '/api/v1/register';
            var errEl = document.getElementById('auth-error');

            try {
                var r = await fetch(endpoint, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email: email, password: password})
                });
                var d = await r.json();
                if (d.status === 'success') {
                    window.location.href = '/';
                } else {
                    errEl.textContent = d.message;
                    errEl.classList.remove('hidden');
                }
            } catch(e) {
                errEl.textContent = 'Ошибка соединения';
                errEl.classList.remove('hidden');
            }
            return false;
        }

        (function() {})();
    </script>
</body>
</html>
