{% extends "base.html" %}
{% block title %}HomeMoney | Отчёты{% endblock %}
{% block content %}
<div class="page-header">
    <h2>Отчёты</h2>
    <form class="period-form" onsubmit="loadReport(event)">
        <label>Месяц <select id="r-month">
            {% for m in range(1,13) %}<option value="{{ m }}" {% if m == current_month %}selected{% endif %}>{{ m }}</option>{% endfor %}
        </select></label>
        <label>Год <select id="r-year">
            {% for y in range(current_year-1, current_year+2) %}<option value="{{ y }}" {% if y == current_year %}selected{% endif %}>{{ y }}</option>{% endfor %}
        </select></label>
        <button type="submit" class="btn">Сформировать</button>
    </form>
</div>

<div class="summary-cards" id="report-summary"></div>
<div class="summary-cards" id="report-balance" style="margin-top:12px"></div>
<div class="summary-cards" id="report-savings" style="margin-top:12px"></div>
<div class="section">
    <h3>Детализация расходов по категориям</h3>
    <table class="data-table">
        <thead><tr><th>Категория</th><th>Потрачено</th><th>Бюджет</th><th>Остаток</th></tr></thead>
        <tbody id="report-table"></tbody>
    </table>
</div>

<script>
    var typeIcons = { deposit: '🏦', stocks: '📈', bonds: '📜', cash: '💵', other: '📦' };

    async function loadReport(e) {
        if (e) e.preventDefault();
        var m = document.getElementById('r-month').value;
        var y = document.getElementById('r-year').value;
        var r = await fetch('/api/v1/reports?month=' + m + '&year=' + y + '&_=' + Date.now(), { headers: authHeaders() });
        var d = await r.json();
        if (d.status !== 'success') { alert(d.message); return; }
        var s = d.data.summary;
        document.getElementById('report-summary').innerHTML =
            '<div class="card"><span class="card-label">💰 Доходы</span><span class="card-value" style="color:var(--color-success)">+' + fmt(s.total_income || 0) + ' RUB</span></div>' +
            '<div class="card"><span class="card-label">💳 Расходы</span><span class="card-value" style="color:var(--color-danger)">-' + fmt(s.total_spent) + ' RUB</span></div>' +
            '<div class="card"><span class="card-label">📊 Бюджет</span><span class="card-value">' + fmt(s.total_budgeted) + ' RUB</span></div>';
        document.getElementById('report-balance').innerHTML =
            '<div class="card"><span class="card-label">Остаток на начало</span><span class="card-value">' + fmt(s.opening_balance || 0) + ' RUB</span></div>' +
            '<div class="card"><span class="card-label">Остаток на конец</span><span class="card-value">' + fmt(s.closing_balance || 0) + ' RUB</span></div>';
        var sv = d.data.savings;
        if (sv && sv.items && sv.items.length) {
            document.getElementById('report-savings').innerHTML =
                '<div class="card" style="grid-column:1/-1;text-align:left">' +
                '<span class="card-label">🏦 Накопления (всего: ' + fmt(sv.total) + ' RUB)</span><br>' +
                sv.items.map(function(x) {
                    var ic = typeIcons[x.type] || '📦';
                    return '<span style="display:inline-block;margin:4px 12px 4px 0">' + ic + ' ' + x.name + ': <strong>' + fmt(x.amount) + ' RUB</strong> (' + x.type_label + ')</span><br>';
                }).join('') +
                '</div>';
        } else {
            document.getElementById('report-savings').innerHTML = '';
        }
        var tbody = document.getElementById('report-table');
        var keys = Object.keys(d.data.detailed_spending || {});
        if (keys.length === 0) { tbody.innerHTML = '<tr><td colspan="4">Нет расходов за выбранный период.</td></tr>'; return; }
        tbody.innerHTML = keys.map(function(k) {
            var item = d.data.detailed_spending[k];
            var rem = fmt(item.budget - item.spent);
            var icon = item.icon || '📁';
            return '<tr><td>' + icon + ' ' + item.name + '</td><td>' + fmt(item.spent) + '</td><td>' + fmt(item.budget) + '</td><td>' + rem + '</td></tr>';
        }).join('');
    }
    window.onload = loadReport;
</script>
{% endblock %}
