{% extends "base.html" %}
{% block title %}HomeMoney | Отчёты{% endblock %}
{% block content %}
<div class="page-header">
    <h2>Отчёты</h2>
    <form class="period-form" id="report-form">
        <div class="flex-row">
            <div>
                <button type="button" class="btn" data-preset="month,-1">Прошлый месяц</button>
                <button type="button" class="btn" data-preset="month,0">Текущий месяц</button>
                <button type="button" class="btn" data-preset="quarter,0">Квартал</button>
                <button type="button" class="btn" data-preset="year,0">Год</button>
                <button type="button" class="btn" data-preset="custom">Произвольно</button>
            </div>
        </div>
        <div id="date-range-group" class="flex-row mt-8">
            <label>Начало <input type="date" id="r-start"></label>
            <label>Конец <input type="date" id="r-end"></label>
            <label>Категория <select id="r-category"><option value="">Все</option></select></label>
            <label><input type="checkbox" id="r-show-tx"> Список транзакций</label>
            <button type="submit" class="btn">Сформировать</button>
        </div>
    </form>
</div>

<div class="summary-cards" id="report-summary"></div>
<div class="summary-cards mt-12" id="report-balance"></div>
<div class="summary-cards mt-12" id="report-savings"></div>
<div class="section" id="category-detail-section">
    <h3>Детализация расходов по категориям</h3>
    <table class="data-table">
        <thead><tr><th>Категория</th><th>Потрачено</th><th>Бюджет</th><th>Остаток</th></tr></thead>
        <tbody id="report-table"></tbody>
    </table>
</div>
<div class="section hidden" id="tx-list-section">
    <h3>Все транзакции за период <span id="tx-list-title"></span></h3>
    <table class="data-table">
        <thead><tr><th>ID</th><th>Категория</th><th>Сумма</th><th>Описание</th><th>Дата</th><th>Тип</th></tr></thead>
        <tbody id="tx-list-table"></tbody>
    </table>
</div>

{% block scripts %}
<script src="{{ url_for('static', filename='js/pages/reports.js') }}"></script>
{% endblock %}
{% endblock %}
