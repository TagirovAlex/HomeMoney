{% extends "base.html" %}
{% block title %}HomeMoney | Накопления{% endblock %}
{% block content %}
<div class="page-header">
    <h2>Накопления</h2>
    <button class="btn" onclick="showAddForm()">+ Добавить</button>
</div>

<div id="add-form" class="form-card hidden">
    <h3 id="form-title">Новое накопление</h3>
    <form onsubmit="saveSaving(event)">
        <input type="hidden" id="saving-id" value="">
        <label>Название <input type="text" id="saving-name" required></label>
        <label>Сумма <input type="number" step="0.01" id="saving-amount" value="0" required></label>
        <label>Тип
            <select id="saving-type">
                <option value="deposit">🏦 Депозит</option>
                <option value="stocks">📈 Акции</option>
                <option value="bonds">📜 Облигации</option>
                <option value="cash">💵 Наличные</option>
                <option value="other">📦 Другое</option>
            </select>
        </label>
        <label>Описание <input type="text" id="saving-desc"></label>
        <button type="submit" class="btn" id="form-submit">Сохранить</button>
        <button type="button" class="btn btn-secondary" onclick="hideAddForm()">Отмена</button>
    </form>
</div>

<div id="savings-list" class="summary-cards"></div>

{% block scripts %}
<script src="{{ url_for('static', filename='js/pages/savings.js') }}"></script>
{% endblock %}
{% endblock %}
