{% extends "base.html" %}
{% block title %}HomeMoney | Транзакции{% endblock %}
{% block content %}
<div class="page-header">
    <h2>Транзакции</h2>
    <button class="btn" onclick="showAddForm()">+ Добавить</button>
</div>

<div id="add-form" class="form-card" style="display:none">
    <h3>Новая транзакция</h3>
    <form onsubmit="addTransaction(event)">
        <label>Сумма <input type="number" step="0.01" id="tx-amount" required></label>
        <label>Категория <select id="tx-category" required></select></label>
        <label>Описание <input type="text" id="tx-desc"></label>
        <button type="submit" class="btn">Сохранить</button>
        <button type="button" class="btn btn-secondary" onclick="hideAddForm()">Отмена</button>
    </form>
</div>

<div class="filter-bar">
    <label>Месяц
        <select id="f-month">
            <option value="1">Янв</option><option value="2">Фев</option><option value="3">Мар</option>
            <option value="4">Апр</option><option value="5">Май</option><option value="6">Июн</option>
            <option value="7">Июл</option><option value="8">Авг</option><option value="9">Сен</option>
            <option value="10">Окт</option><option value="11">Ноя</option><option value="12">Дек</option>
        </select>
    </label>
    <label>Год
        <select id="f-year"></select>
    </label>
    <label>Категория
        <select id="f-category"><option value="">Все</option></select>
    </label>
    <button class="btn" onclick="loadTransactions()">Применить</button>
</div>

<table class="data-table">
    <thead>
        <tr><th>ID</th><th>Категория</th><th>Сумма</th><th>Описание</th><th>Дата</th></tr>
    </thead>
    <tbody id="tx-table"></tbody>
</table>

<div class="pagination" id="pagination" style="display:none">
    <button class="btn btn-secondary" id="prev-page" onclick="goPage(-1)">← Назад</button>
    <span id="page-info"></span>
    <button class="btn btn-secondary" id="next-page" onclick="goPage(1)">Вперед →</button>
</div>

<script>
    var userId = null, curPage = 1, totalPages = 1;

    function getUser() {
        try { var u = JSON.parse(localStorage.getItem('user')); userId = u.id; } catch(e) { userId = null; }
    }

    function initFilters() {
        var now = new Date();
        var m = document.getElementById('f-month');
        m.value = now.getMonth() + 1;
        var y = document.getElementById('f-year');
        for (var i = now.getFullYear() - 2; i <= now.getFullYear() + 1; i++) {
            var opt = document.createElement('option');
            opt.value = i; opt.textContent = i;
            if (i === now.getFullYear()) opt.selected = true;
            y.appendChild(opt);
        }
        loadCategoriesFilter();
    }

    async function loadCategoriesFilter() {
        var r = await fetch('/api/v1/categories', { headers: authHeaders() });
        var d = await r.json();
        if (d.status !== 'success') return;
        var sel = document.getElementById('f-category');
        sel.innerHTML = '<option value="">Все</option>' +
            d.data.map(function(c) { return '<option value="' + c.id + '">' + c.name + '</option>'; }).join('');
    }

    async function loadCategories() {
        var r = await fetch('/api/v1/categories', { headers: authHeaders() });
        var d = await r.json();
        if (d.status !== 'success') return;
        var sel = document.getElementById('tx-category');
        sel.innerHTML = '<option value="">-- Выберите --</option>' +
            d.data.map(function(c) { return '<option value="' + c.id + '">' + (c.icon || '') + ' ' + c.name + '</option>'; }).join('');
    }

    async function loadTransactions() {
        getUser();
        if (!userId) return;
        var m = document.getElementById('f-month').value;
        var y = document.getElementById('f-year').value;
        var cat = document.getElementById('f-category').value;
        var r = await fetch('/api/v1/user/' + userId + '/transactions?month=' + m + '&year=' + y + '&category_id=' + cat + '&page=' + curPage + '&limit=20', { headers: authHeaders() });
        var d = await r.json();
        var tbody = document.getElementById('tx-table');
        if (d.status !== 'success') { tbody.innerHTML = '<tr><td colspan="5">' + d.message + '</td></tr>'; return; }
        if (!d.data.length) { tbody.innerHTML = '<tr><td colspan="5">Нет транзакций</td></tr>'; return; }
        tbody.innerHTML = d.data.map(function(tx) {
            return '<tr><td>' + tx.id + '</td><td>' + (tx.category_icon || '📁') + ' ' + tx.category_name + '</td><td>' + tx.amount.toFixed(2) + '</td><td>' + tx.description + '</td><td>' + (tx.date ? tx.date.slice(0, 10) : '') + '</td></tr>';
        }).join('');
        totalPages = Math.ceil(d.total / d.limit) || 1;
        document.getElementById('pagination').style.display = 'block';
        document.getElementById('page-info').textContent = curPage + ' / ' + totalPages;
        document.getElementById('prev-page').disabled = curPage <= 1;
        document.getElementById('next-page').disabled = curPage >= totalPages;
    }

    function goPage(delta) {
        var np = curPage + delta;
        if (np < 1 || np > totalPages) return;
        curPage = np;
        loadTransactions();
    }

    function showAddForm() { document.getElementById('add-form').style.display = 'block'; }
    function hideAddForm() { document.getElementById('add-form').style.display = 'none'; }

    async function addTransaction(e) {
        e.preventDefault();
        getUser();
        if (!userId) { alert('Ошибка авторизации'); return; }
        var r = await fetch('/api/v1/user/' + userId + '/create_transaction', {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify({
                amount: parseFloat(document.getElementById('tx-amount').value),
                category_id: parseInt(document.getElementById('tx-category').value),
                description: document.getElementById('tx-desc').value
            })
        });
        var d = await r.json();
        alert(d.message || d.error);
        if (r.ok) { hideAddForm(); loadTransactions(); }
    }

    window.onload = function() { initFilters(); loadCategories(); loadTransactions(); };
</script>
{% endblock %}
