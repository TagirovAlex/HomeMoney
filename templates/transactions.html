{% extends "base.html" %}
{% block title %}HomeMoney | Транзакции{% endblock %}
{% block content %}
<div class="page-header">
    <h2>Транзакции</h2>
    <button class="btn" onclick="showAddForm()">+ Добавить</button>
</div>

<div id="add-form" class="form-card" style="display:none">
    <h3>Новая транзакция</h3>
    <form onsubmit="addTransaction(event)">
        <label>Сумма <input type="number" step="0.01" id="tx-amount" required></label>
        <label>Категория <select id="tx-category" required></select></label>
        <label>Описание <input type="text" id="tx-desc"></label>
        <button type="submit" class="btn">Сохранить</button>
        <button type="button" class="btn btn-secondary" onclick="hideAddForm()">Отмена</button>
    </form>
</div>

<table class="data-table">
    <thead>
        <tr><th>ID</th><th>Категория</th><th>Сумма</th><th>Описание</th><th>Дата</th></tr>
    </thead>
    <tbody id="tx-table"></tbody>
</table>

<script>
    var userId = null;

    function getUser() {
        try { var u = JSON.parse(localStorage.getItem('user')); userId = u.id; } catch(e) { userId = null; }
    }

    async function loadCategories() {
        var r = await fetch('/api/v1/categories', { headers: authHeaders() });
        var d = await r.json();
        if (d.status !== 'success') return;
        var sel = document.getElementById('tx-category');
        sel.innerHTML = '<option value="">-- Выберите --</option>' +
            d.data.map(function(c) { return '<option value="' + c.id + '">' + c.name + '</option>'; }).join('');
    }

    async function loadTransactions() {
        getUser();
        if (!userId) return;
        var r = await fetch('/api/v1/user/' + userId + '/transactions', { headers: authHeaders() });
        var d = await r.json();
        var tbody = document.getElementById('tx-table');
        if (d.status !== 'success') { tbody.innerHTML = '<tr><td colspan="5">' + d.message + '</td></tr>'; return; }
        if (!d.data.length) { tbody.innerHTML = '<tr><td colspan="5">Нет транзакций</td></tr>'; return; }
        tbody.innerHTML = d.data.map(function(tx) {
            return '<tr><td>' + tx.id + '</td><td>' + tx.category_name + '</td><td>' + tx.amount.toFixed(2) + '</td><td>' + tx.description + '</td><td>' + (tx.date ? tx.date.slice(0, 10) : '') + '</td></tr>';
        }).join('');
    }

    function showAddForm() { document.getElementById('add-form').style.display = 'block'; }
    function hideAddForm() { document.getElementById('add-form').style.display = 'none'; }

    async function addTransaction(e) {
        e.preventDefault();
        getUser();
        if (!userId) { alert('Ошибка авторизации'); return; }
        var r = await fetch('/api/v1/user/' + userId + '/create_transaction', {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify({
                amount: parseFloat(document.getElementById('tx-amount').value),
                category_id: parseInt(document.getElementById('tx-category').value),
                description: document.getElementById('tx-desc').value
            })
        });
        var d = await r.json();
        alert(d.message || d.error);
        if (r.ok) { hideAddForm(); loadTransactions(); }
    }

    window.onload = function() { loadCategories(); loadTransactions(); };
</script>
{% endblock %}
